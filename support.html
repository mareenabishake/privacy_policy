<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketPilot Support</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #10B981 0%, #059669 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --text-color: #1F2937;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.15) 0px, transparent 50%);
            color: var(--text-color);
        }

        .container {
            background: var(--glass-bg);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            text-align: center;
            max-width: 90%;
            width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .icon-wrapper {
            width: 64px;
            height: 64px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: #059669;
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: 1.75rem;
            font-weight: 700;
            color: #111827;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #6B7280;
        }

        .contact-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--primary-gradient);
            color: white;
            padding: 14px 32px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2), 0 2px 4px -1px rgba(16, 185, 129, 0.1);
            width: 100%;
            box-sizing: border-box;
        }

        .contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3), 0 4px 6px -2px rgba(16, 185, 129, 0.15);
        }

        .email-display {
            display: block;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: #6B7280;
            font-weight: 500;
            background: #F9FAFB;
            padding: 10px;
            border-radius: 8px;
            user-select: all;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
        </div>
        <h1>MarketPilot Support</h1>
        <p>Experiencing issues or have feature requests? Our team is ready to assist you on your investment journey.</p>
        
        <a href="mailto:marketpilot.app@gmail.com?subject=Support Request" class="contact-btn">
            Send Email
        </a>
        
        <div class="email-display">
            marketpilot.app@gmail.com
        </div>
    </div>
</body>
</html>
